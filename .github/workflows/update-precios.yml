name: Actualizar precios PetroPerú

on:
  schedule:
    # 08:00 hora Perú (UTC-5) todos los días
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr update.py
        # --year all: procesa cualquier PDF nuevo sin importar el año, así el
        # workflow no necesita mantenimiento al cruzar de 2026 a 2027. Los
        # lista_id ya presentes en data/precios.csv se saltan (idempotente).
        run: python update.py --year all

      - name: Commit y push si data/precios.csv cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/precios.csv; then
            git add data/precios.csv
            git commit -m "Actualiza data/precios.csv ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sin listas nuevas — data/precios.csv sin cambios."
          fi
