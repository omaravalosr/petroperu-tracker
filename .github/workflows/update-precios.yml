name: Actualizar precios PetroPerú

on:
  schedule:
    # 08:00 hora Perú (UTC-5) todos los días
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr update.py
        # Año actual calculado en runtime (no "--year all"): el dataset del
        # proyecto solo cubre el año en curso. "--year all" trae TODO el
        # histórico de PetroPerú (desde 2021+) la primera vez que corre,
        # porque esos lista_id nunca estuvieron en el CSV — no es "traer lo
        # nuevo", es un backfill completo. Con el año dinámico, el workflow
        # sigue funcionando sin mantenimiento al cruzar a 2027 sin ese riesgo.
        run: python update.py --year "$(date -u +%Y)" --month all

      - name: Commit y push si data/precios.csv cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/precios.csv; then
            git add data/precios.csv
            git commit -m "Actualiza data/precios.csv ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sin listas nuevas — data/precios.csv sin cambios."
          fi
